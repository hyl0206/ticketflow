spring:
  jackson:
    deserialization:
      fail-on-numbers-for-enums: true
      accept-float-as-int: false
  application:
    name: ticketflow

  datasource:
    url: jdbc:mysql://localhost:3306/ticketflow
    username: ticketflow_user
    password: ${TICKETFLOW_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

ticketflow:
  jwt:
    secret: ${TICKETFLOW_JWT_SECRET}
    issuer: ticketflow
    ttl: PT1H

server:
  error:
    include-message: never
    include-stacktrace: never

springdoc:
  swagger-ui:
    persist-authorization: false
